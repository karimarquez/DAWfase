<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Reportes y Estadísticas</title>

    <!-- Fuente moderna Google Fonts (Inter) -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary-color: #89564e;
            --primary-hover: #70443e;
            --bg-color: #fbf8f4;
            --card-bg: #ffffff;
            --text-primary: #342b27;
            --text-secondary: #75665f;
            --border-color: #e7d4c5;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            margin: 0;
            padding: 40px 20px;
            background:
                radial-gradient(ellipse at 85% 0%, rgba(231, 212, 197, 0.36), transparent 36rem),
                var(--bg-color);
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 16px;
            padding: 28px;
            box-shadow: 0 14px 36px rgba(69, 49, 40, 0.08);
            border: 1px solid var(--border-color);
        }

        .header-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            flex-wrap: wrap;
            gap: 16px;
        }

        .header-title h2 {
            margin: 0;
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--text-primary);
        }

        .header-title p {
            margin: 4px 0 0 0;
            font-size: 0.875rem;
            color: var(--text-secondary);
        }

        .filter-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .filter-group label {
            font-size: 0.875rem;
            font-weight: 500;
            color: var(--text-secondary);
        }

        select {
            padding: 8px 14px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background-color: #ffffff;
            font-family: inherit;
            font-size: 0.875rem;
            color: var(--text-primary);
            outline: none;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        select:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(137, 86, 78, 0.15);
        }

        .chart-container {
            position: relative;
            width: 100%;
            height: 380px;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            margin-bottom: 18px;
            padding: 10px 16px;
            border-radius: 999px;
            background: var(--primary-color);
            color: #ffffff;
            font-size: 0.9rem;
            font-weight: 600;
            text-decoration: none;
            transition: background-color 0.2s ease, transform 0.2s ease;
        }

        .back-link:hover {
            background: var(--primary-hover);
            transform: translateY(-1px);
        }

        @media (max-width: 600px) {
            body {
                padding: 24px 14px;
            }

            .card {
                padding: 20px 16px;
            }

            .chart-container {
                height: 300px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <a class="back-link" href="./" aria-label="Volver a la página principal de Aesthetica">← Volver a Aesthetica</a>
        <div class="card">
            <div class="header-section">
                <div class="header-title">
                    <h2>Reporte General de Servicios</h2>
                    <p>Visualización estadística comparativa por periodo anual</p>
                </div>
                <div class="filter-group">
                    <label for="selectAnio">Seleccionar Año:</label>
                    <select id="selectAnio">
                        <option value="2026">Año 2026</option>
                        <option value="2025">Año 2025</option>
                        <option value="2024">Año 2024</option>
                    </select>
                </div>
            </div>

            <div class="chart-container">
                <canvas id="miGrafico"></canvas>
            </div>
        </div>
    </div>

    <script type="module" src="/src/reportes.js"></script>
</body>
</html>
